name: Deploy AGGITS Video Jukeboxes

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "static/machine-statistics.js"
      - "tools/inject_daas_statistics.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preserve DAAS first-party statistics
        run: python tools/inject_daas_statistics.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
