name: Deploy AGGITS Video Jukeboxes

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "static/machine-statistics.js"
      - "static/comedy-arcade/**"
      - "tools/inject_daas_statistics.py"
      - "tools/inject_arcade_shares.py"
      - "src/aggits_video_factory/arcade_presentation.py"
      - "static/arcade-presentation.js"
      - "static/arcade-navigation.js"
      - "static/arcade-navigation.css"
      - ".github/workflows/deploy-pages.yml"
      - "src/aggits_video_factory/arcade_publish_guard.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/configure-pages@v5
      # arcade-publish-isolation-v1: gallery publication never rewrites machines.
      - name: Identify isolated Arcade publication
        id: arcade_scope
        run: python src/aggits_video_factory/arcade_publish_guard.py
      - name: Preserve approved Arcade theatrical share links
        if: steps.arcade_scope.outputs.arcade_only != 'true'
        run: python tools/inject_arcade_shares.py
      - name: Preserve per-machine reel spin statistics
        if: steps.arcade_scope.outputs.arcade_only != 'true'
        run: python tools/inject_daas_statistics.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
